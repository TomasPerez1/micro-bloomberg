services:
  news_db:
    image: postgres:16-alpine
    container_name: news
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news}
      POSTGRES_DB: ${POSTGRES_DB:-news}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./services/news/db/init/:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-news} -d ${POSTGRES_DB:-news}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
  markets_db:
      image: postgres:16-alpine
      container_name: markets
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${POSTGRES_USER:-markets}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-markets}
        POSTGRES_DB: ${POSTGRES_DB:-markets}
      ports:
        - "${POSTGRES_PORT:-5434}:5432"
      volumes:
        - ./services/international-markets/db/init/:/docker-entrypoint-initdb.d/init.sql
      healthcheck:
        test:
          [
            "CMD-SHELL",
            "pg_isready -U ${POSTGRES_USER:-markets} -d ${POSTGRES_DB:-markets}",
          ]
        interval: 5s
        timeout: 5s
        retries: 12
volumes:
  jh_pgdata:
